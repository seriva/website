<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://giscus.app; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://giscus.app; img-src 'self' data: https://raw.githubusercontent.com https://avatars.githubusercontent.com https://i.imgur.com https://i.ytimg.com https://img.youtube.com; font-src 'self' data:; connect-src 'self' http://localhost:8181 ws://localhost:8181 wss://localhost:8181 https://raw.githubusercontent.com https://api.emailjs.com; frame-src 'self' http://localhost:8181 https://giscus.app https://www.youtube.com https://youtube.com https://seriva.github.io; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="luukvanvenrooij.nl">
    <meta property="og:description" content="Luuk van Venrooij - Full-stack developer specializing in graphics, games, and web development. Check out my projects and get in touch!">
    <meta property="og:image" content="/og-image.jpg">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="luukvanvenrooij.nl">
    <meta property="twitter:description" content="Luuk van Venrooij - Full-stack developer specializing in graphics, games, and web development. Check out my projects and get in touch!">
    <meta property="twitter:image" content="/og-image.jpg">
    
    <title>luukvanvenrooij.nl</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <!-- RSS Feed -->
    <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="/rss.xml">
    
    <!-- Performance Optimizations -->
    <!-- Preload critical resources -->
    <link rel="preload" href="/fonts/raleway-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/data/content.json" as="fetch" crossorigin>
    
    <!-- Preconnect to external domains we'll use -->
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
    
    <!-- Critical styles & pre-paint theme initialization -->
    <style>
        :root {
            --background-color: #0D1117;
            --font-color: #E6EDF3;
            --header-color: #111827;
        }
        :root[data-theme="light"] {
            --background-color: #FFFFFF;
            --font-color: #0F172A;
            --header-color: #D1D5DB;
        }
        html {
            background-color: var(--background-color);
            color: var(--font-color);
            margin: 0;
        }
        body {
            background-color: var(--background-color);
            color: var(--font-color);
            margin: 0;
            padding-top: 56px;
            font-family: Raleway, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
    <link rel="stylesheet" href="/css/app.css">
    <!-- Blocking on purpose: sets data-theme before first paint (external for CSP) -->
    <script src="/boot.js"></script>
</head>
<body>
    <!-- Main application root -->
    <div id="app">
        <header class="navbar">
            <div class="navbar-container">
                <a class="navbar-brand" href="/">Luuk van Venrooij</a>
            </div>
        </header>
        <main id="main-content" tabindex="-1">
            <div class="page-loading-skeleton" aria-hidden="true">
                <div class="skeleton-header"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
            </div>
        </main>
    </div>
    <script type="module" src="/vendor.js"></script>
    <script type="module" src="/app.js"></script>
</body>
</html>

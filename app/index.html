<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Portfolio website - will be updated dynamically">
    <meta name="author" content="Portfolio Owner">
    <meta name="theme-color" content="#429BEE">
    
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://giscus.app; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://giscus.app; img-src 'self' data: https://raw.githubusercontent.com https://avatars.githubusercontent.com https://i.imgur.com https://i.ytimg.com https://img.youtube.com; font-src 'self' data:; connect-src 'self' http://localhost:8081 ws://localhost:8081 wss://localhost:8081 http://localhost:8181 ws://localhost:8181 wss://localhost:8181 https://raw.githubusercontent.com https://api.emailjs.com; frame-src 'self' http://localhost:8181 https://giscus.app https://www.youtube.com https://youtube.com https://seriva.github.io; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Portfolio Website">
    <meta property="og:description" content="Portfolio website - will be updated dynamically">
    <meta property="og:image" content="/og-image.jpg">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Portfolio Website">
    <meta property="twitter:description" content="Portfolio website - will be updated dynamically">
    <meta property="twitter:image" content="/og-image.jpg">
    
    <title>Portfolio Website</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <!-- RSS Feed -->
    <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="/rss.xml">
    
    <!-- Performance Optimizations -->
    <!-- Preload critical resources -->
    <link rel="modulepreload" href="/vendor.js">
    <link rel="modulepreload" href="/app.js">
    
    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://raw.githubusercontent.com">
    
    <!-- Preconnect to external domains we'll use -->
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
    
    <!-- Critical styles & pre-paint theme initialization -->
    <style>
        :root {
            --background-color: #0D1117;
            --font-color: #E6EDF3;
            --header-color: #111827;
        }
        :root[data-theme="light"] {
            --background-color: #FFFFFF;
            --font-color: #0F172A;
            --header-color: #D1D5DB;
        }
        html {
            background-color: var(--background-color);
            color: var(--font-color);
            margin: 0;
        }
        body {
            background-color: var(--background-color);
            color: var(--font-color);
            margin: 0;
            padding-top: 56px;
            font-family: Raleway, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
    <script>
        try {
            const saved = localStorage.getItem("theme-preference");
            if (saved) {
                document.documentElement.setAttribute("data-theme", saved);
            } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
                document.documentElement.setAttribute("data-theme", "light");
            } else {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        } catch (e) {}
    </script>
</head>
<body>
    <!-- Main application root -->
    <div id="app"></div>
    <script type="module" src="/vendor.js"></script>
    <script type="module" src="/js/prism-autoloader.min.js"></script>
    <script>
        window.sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        window.createFuse = (list, opts) => new (window.Fuse || window["fuse.js"])(list, opts);
        window.objectEntries = (obj) => (obj ? Object.entries(obj).map(([key, value]) => ({ key, value })) : []);
    </script>
    <script type="module">
        if (window.Prism?.plugins?.autoloader) {
            window.Prism.plugins.autoloader.languages_path = "/js/prism-components/";
            window.Prism.plugins.autoloader.loadLanguages(["go", "bash", "yaml", "json", "rust", "python", "typescript", "c", "cpp"]);
        }
    </script>
    <script type="module" src="/app.js"></script>
</body>
</html>
